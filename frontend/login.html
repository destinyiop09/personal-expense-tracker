<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FinPulse</title>
  <meta name="description" content="Sign in to your FinPulse account to track your expenses, review budgets, and view financial analytics.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <!-- Brand Logo Linking to App -->
    <a href="index.html" class="auth-brand-logo" title="FinPulse Home">
      <span class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </span>
      <span>FinPulse</span>
    </a>

    <!-- Auth Card -->
    <div class="auth-card" id="loginCard">
      <div class="auth-header">
        <div class="auth-header-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to access your dashboard, budgets, and analytics</p>
      </div>

      <!-- Alert / Notification Box -->
      <div id="authAlert" class="alert" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            name="email" 
            class="form-input" 
            placeholder="demo@finpulse.app" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="loginPassword" 
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink" style="font-size: 12px; color: var(--primary); text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="auth-footer">
        <div>
          Don't have an account? <a href="register.html" id="goToRegisterLink">Create an account</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Vanilla Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
