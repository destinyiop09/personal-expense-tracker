<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FinPulse</title>
  <meta name="description" content="Create a new FinPulse account to begin managing your finances, setting category budgets, and logging transactions.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <!-- Brand Logo Linking to App -->
    <a href="index.html" class="auth-brand-logo" title="FinPulse Home">
      <span class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </span>
      <span>FinPulse</span>
    </a>

    <!-- Auth Card -->
    <div class="auth-card" id="registerCard">
      <div class="auth-header">
        <div class="auth-header-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7.5" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Start tracking your expenses and budgeting with FinPulse</p>
      </div>

      <!-- Alert / Notification Box -->
      <div id="registerAlert" class="alert" role="alert"></div>

      <!-- Registration Form -->
      <form id="registerForm" autocomplete="on">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input 
            type="text" 
            id="registerName" 
            name="name" 
            class="form-input" 
            placeholder="Jane Doe" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">Email Address</label>
          <input 
            type="email" 
            id="registerEmail" 
            name="email" 
            class="form-input" 
            placeholder="jane@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="registerPassword" 
              name="password" 
              class="form-input" 
              placeholder="At least 6 characters" 
              required 
              autocomplete="new-password"
              minlength="6"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="registerPassword" 
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="registerConfirmPassword">Confirm Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="registerConfirmPassword" 
              name="confirmPassword" 
              class="form-input" 
              placeholder="Repeat your password" 
              required 
              autocomplete="new-password"
              minlength="6"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="registerConfirmPassword" 
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="registerTerms" checked required>
            <span>I accept terms & privacy</span>
          </label>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7.5" r="4"></circle>
            <polyline points="17 11 19 13 23 9"></polyline>
          </svg>
          Create Account & Sign In
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="auth-footer">
        <div>
          Already have an account? <a href="login.html" id="goToLoginLink">Sign In here</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Vanilla Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
